<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speech Synthesis Test</title>
  </head>
  <body>
    <h1>Speech Synthesis Test</h1>
    <input type="text" id="text-to-speak" placeholder="Enter text to speak" />
    <button onclick="speakText()">Speak</button>

    <script>
      let voices = [];

      function loadVoices() {
        voices = window.speechSynthesis.getVoices();
        console.log("Available voices:", voices);
        if (voices.length === 0) {
          console.error("No voices available for speech synthesis.");
        }
      }

      function speakText() {
        const text = document.getElementById("text-to-speak").value;
        if (window.speechSynthesis) {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = "en-US"; // Set the language if needed

          // Select a specific voice if available
          if (voices.length > 0) {
            console.log("choosed voice");
            utterance.voice =
              voices.find((voice) => voice.lang === "en-US") || voices[0];
          } else {
            console.error("No voices available for speech synthesis.");
          }

          utterance.onend = () => {
            console.log("Speech synthesis finished.");
          };
          utterance.onerror = (event) => {
            console.error("Speech synthesis error:", event.error);
          };
          window.speechSynthesis.speak(utterance);
          console.log("Speech synthesis started.");
        } else {
          console.error("Speech synthesis not supported.");
        }
      }

      // Load voices when they are changed
      window.speechSynthesis.onvoiceschanged = loadVoices;

      // Load voices initially with a delay to ensure they are available
      setTimeout(() => {
        loadVoices();
      }, 1000);
    </script>
  </body>
</html>
